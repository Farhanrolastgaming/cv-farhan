<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700" width="100%" height="100%">
  <!-- Transparent Background Cutout Persona 3 (Tech Cyber Systems Analyst Hero) -->
  <defs>
    <linearGradient id="silverHair" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <linearGradient id="techCoat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <filter id="shadow3" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <g filter="url(#shadow3)">
    <!-- Flowing Coat Tails -->
    <path d="M160 380 L110 590 L210 570 Z" fill="url(#techCoat)"/>
    <path d="M340 380 L390 590 L290 570 Z" fill="url(#techCoat)"/>

    <!-- Flowing Silver Hair (Back) -->
    <path d="M180 180 C110 270, 100 420, 130 550 C160 480, 170 410, 190 340 Z" fill="url(#silverHair)"/>
    <path d="M320 180 C390 270, 400 420, 370 550 C340 480, 330 410, 310 340 Z" fill="url(#silverHair)"/>

    <!-- Long Boots & Trousers -->
    <path d="M210 520 L205 680 L235 680 L245 520 Z" fill="#0B1120"/>
    <path d="M255 520 L265 680 L295 680 L290 520 Z" fill="#0B1120"/>
    <line x1="205" y1="580" x2="240" y2="580" stroke="#0CA9B7" stroke-width="3"/>
    <line x1="260" y1="580" x2="295" y2="580" stroke="#0CA9B7" stroke-width="3"/>

    <!-- Cyber Armor Vest & Jacket -->
    <path d="M190 290 L160 520 L340 520 L310 290 Z" fill="url(#techCoat)" stroke="#334155" stroke-width="2"/>
    <path d="M220 290 L250 420 L280 290 Z" fill="#0CA9B7" fill-opacity="0.25"/>
    <polygon points="250,330 262,350 250,370 238,350" fill="#38BDF8"/>

    <!-- Head & Neck -->
    <polygon points="238,245 262,245 256,280 244,280" fill="#FFE4E6"/>
    <path d="M210 180 C210 245, 290 245, 290 180 C290 145, 210 145, 210 180 Z" fill="#FFF1F2"/>

    <!-- Confident Eyes (Violet / Cyan) -->
    <ellipse cx="232" cy="190" rx="8" ry="11" fill="#8B5CF6"/>
    <circle cx="230" cy="186" r="3" fill="#FFFFFF"/>
    <circle cx="234" cy="193" r="1.5" fill="#38BDF8"/>
    <path d="M222 180 Q232 175 242 181" stroke="#0F172A" stroke-width="3" fill="none" stroke-linecap="round"/>

    <ellipse cx="268" cy="190" rx="8" ry="11" fill="#8B5CF6"/>
    <circle cx="266" cy="186" r="3" fill="#FFFFFF"/>
    <circle cx="270" cy="193" r="1.5" fill="#38BDF8"/>
    <path d="M258 181 Q268 175 278 180" stroke="#0F172A" stroke-width="3" fill="none" stroke-linecap="round"/>

    <!-- Confident Smirk -->
    <path d="M245 214 Q254 218 258 212" stroke="#E11D48" stroke-width="2" fill="none" stroke-linecap="round"/>

    <!-- Hair Bangs -->
    <path d="M200 160 C190 200, 215 240, 220 250 C225 220, 230 190, 235 170 Z" fill="url(#silverHair)"/>
    <path d="M300 160 C310 200, 285 240, 280 250 C275 220, 270 190, 265 170 Z" fill="url(#silverHair)"/>
    <path d="M228 150 C238 180, 245 200, 250 210 C255 200, 262 180, 272 150 Z" fill="url(#silverHair)"/>

    <!-- Cyber Visor / Headset -->
    <rect x="202" y="172" width="96" height="6" rx="3" fill="#0CA9B7" fill-opacity="0.8"/>
    <circle cx="202" cy="175" r="7" fill="#0284C7"/>
    <circle cx="298" cy="175" r="7" fill="#0284C7"/>

    <!-- Holographic Floating Screen in Hand -->
    <g transform="translate(290, 330) rotate(-12)">
      <rect width="110" height="70" rx="8" fill="rgba(12, 169, 183, 0.25)" stroke="#38BDF8" stroke-width="2"/>
      <line x1="12" y1="18" x2="60" y2="18" stroke="#38BDF8" stroke-width="2"/>
      <line x1="12" y1="30" x2="85" y2="30" stroke="#FFFFFF" stroke-width="2"/>
      <line x1="12" y1="42" x2="70" y2="42" stroke="#FFFFFF" stroke-width="2"/>
      <circle cx="88" cy="50" r="10" fill="#0CA9B7"/>
    </g>
  </g>
</svg>
