    <text x="18" y="219" font-family="monospace" font-size="11" fill="#38BDF8">AST-0855</text>
    <text x="95" y="219" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#E2E8F0">Raspberry Pi 4 Model B (4GB)</text>
