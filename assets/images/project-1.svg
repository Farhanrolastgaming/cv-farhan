<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" width="100%" height="100%">
  <defs>
    <linearGradient id="p1Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="p1Accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0CA9B7"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <filter id="p1Glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Window Frame Backdrop -->
  <rect width="760" height="480" rx="14" fill="url(#p1Bg)" stroke="#1E293B" stroke-width="2"/>

  <!-- Window Header / Browser Chrome -->
  <path d="M 0 14 C 0 6.27 6.27 0 14 0 L 746 0 C 753.73 0 760 6.27 760 14 L 760 44 L 0 44 Z" fill="#1E293B"/>
  <circle cx="28" cy="22" r="5" fill="#EF4444"/>
  <circle cx="46" cy="22" r="5" fill="#F59E0B"/>
  <circle cx="64" cy="22" r="5" fill="#10B981"/>
  <rect x="94" y="12" width="280" height="20" rx="6" fill="#0F172A"/>
  <text x="110" y="26" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" fill="#94A3B8">https://lab-inventory.farhan.si.id/dashboard</text>

  <!-- Sidebar -->
  <rect x="18" y="58" width="160" height="404" rx="10" fill="#111C33" stroke="#1E293B" stroke-width="1"/>
