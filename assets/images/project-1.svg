  <rect x="30" y="184" width="136" height="28" rx="6" fill="transparent"/>
  <text x="46" y="202" font-family="system-ui, sans-serif" font-size="11" fill="#94A3B8">Berita Acara</text>

  <rect x="30" y="220" width="136" height="28" rx="6" fill="transparent"/>
