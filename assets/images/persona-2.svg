<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700" width="100%" height="100%">
  <!-- Transparent Background Cutout Persona 2 (Pink Hair Maid Halberd Fighter) -->
  <defs>
    <linearGradient id="pinkHair" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE4E6"/>
      <stop offset="50%" stop-color="#F472B6"/>
      <stop offset="100%" stop-color="#DB2777"/>
    </linearGradient>
    <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="50%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="dressBlack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="shadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <g filter="url(#shadow2)">
    <!-- Giant Naginata Blade on the left (Signature weapon from reference image!) -->
    <path d="M70 70 Q90 180 135 270 L150 260 Q105 170 85 65 Z" fill="url(#bladeGrad)" stroke="#334155" stroke-width="2"/>
    <!-- Blade engravings -->
    <path d="M85 110 Q95 160 115 210" stroke="#CBD5E1" stroke-width="2" fill="none"/>
    <!-- Four-point star insignia on blade -->
    <path d="M85 130 L88 120 L91 130 L101 133 L91 136 L88 146 L85 136 L75 133 Z" fill="#0F172A"/>
    <!-- Pole/Shaft running down -->
    <line x1="135" y1="270" x2="330" y2="670" stroke="#475569" stroke-width="8" stroke-linecap="round"/>
    <line x1="135" y1="270" x2="330" y2="670" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>

    <!-- Flowing Pink Hair (Back) -->
    <path d="M180 170 C90 280, 80 440, 110 580 C150 510, 160 420, 190 350 Z" fill="url(#pinkHair)"/>
    <path d="M320 170 C410 280, 420 440, 390 580 C350 510, 340 420, 310 350 Z" fill="url(#pinkHair)"/>

    <!-- Maid Dress Skirt (Black & White Frills) -->
    <!-- White Petticoat Underlayer -->
    <path d="M160 520 C180 620, 320 620, 340 520 C360 640, 140 640, 160 520 Z" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>
    <!-- Main Black Bell Skirt -->
    <path d="M190 380 C130 460, 140 560, 170 560 C230 570, 270 570, 330 560 C360 560, 370 460, 310 380 Z" fill="url(#dressBlack)" stroke="#334155" stroke-width="2"/>
    <!-- White Apron Front -->
    <path d="M210 380 L195 530 C230 540, 270 540, 305 530 L290 380 Z" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>

    <!-- Corset Bodice & Blouse -->
    <path d="M210 300 C200 340, 210 380, 220 385 C235 390, 265 390, 280 385 C290 380, 300 340, 290 300 Z" fill="url(#dressBlack)"/>
    <path d="M215 310 C225 285, 275 285, 285 310 Z" fill="#FFFFFF"/>
    <!-- Purple Bow Ribbon -->
    <polygon points="240,290 260,290 250,305" fill="#A855F7"/>
    <polygon points="250,295 240,315 250,310 260,315" fill="#9333EA"/>

    <!-- Head & Face -->
    <polygon points="238,245 262,245 256,280 244,280" fill="#FFE4E6"/>
    <path d="M210 180 C210 245, 290 245, 290 180 C290 145, 210 145, 210 180 Z" fill="#FFF1F2"/>

    <!-- Cheerful Eyes (Happy closed-eye crescent arch like in reference image!) -->
    <path d="M225 190 Q235 180 245 193" stroke="#0F172A" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <path d="M255 193 Q265 180 275 190" stroke="#0F172A" stroke-width="3.5" fill="none" stroke-linecap="round"/>

    <!-- Cute Smiling Open Mouth & Rosy Cheeks -->
    <path d="M243 208 Q250 220 257 208 Z" fill="#E11D48"/>
    <ellipse cx="222" cy="204" rx="7" ry="4" fill="#FB7185" opacity="0.6"/>
    <ellipse cx="278" cy="204" rx="7" ry="4" fill="#FB7185" opacity="0.6"/>

    <!-- Maid Ruffle Headdress (Brim) -->
    <path d="M200 150 C200 115, 300 115, 300 150 L290 155 C290 125, 210 125, 210 155 Z" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <circle cx="212" cy="155" r="5" fill="#EF4444"/>

    <!-- Front Bangs & Side Locks -->
    <path d="M200 165 C195 205, 215 245, 220 255 C222 225, 228 195, 235 175 Z" fill="url(#pinkHair)"/>
    <path d="M300 165 C305 205, 285 245, 280 255 C278 225, 272 195, 265 175 Z" fill="url(#pinkHair)"/>
    <path d="M230 155 C238 185, 245 200, 250 205 C255 200, 262 185, 270 155 Z" fill="url(#pinkHair)"/>

    <!-- Cute Ahoge (Antenna hair strand) -->
    <path d="M250 140 Q260 115 275 125" stroke="#F472B6" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>
</svg>
