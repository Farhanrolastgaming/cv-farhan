<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="60%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <radialGradient id="halo2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="600" height="500" fill="url(#bg2)"/>
  <circle cx="300" cy="240" r="180" fill="url(#halo2)"/>

  <!-- System Modeling Diagram Mockup (UML & BPMN Flow) -->
  <g transform="translate(100, 90)">
    <!-- Node 1: Start Event -->
    <rect x="20" y="40" width="100" height="48" rx="8" fill="#1E293B" stroke="#0CA9B7" stroke-width="2"/>
    <text x="70" y="69" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">USER LOGIN</text>

    <!-- Arrow -->
    <path d="M120 64 L165 64" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrow)"/>
    
    <!-- Node 2: Process Decision -->
    <polygon points="215,34 265,64 215,94 165,64" fill="#0CA9B7" fill-opacity="0.2" stroke="#0CA9B7" stroke-width="2"/>
    <text x="215" y="68" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="700" fill="#38BDF8" text-anchor="middle">VERIFIKASI</text>

    <!-- Arrow -->
    <path d="M265 64 L310 64" stroke="#38BDF8" stroke-width="2"/>

    <!-- Node 3: Database Storage -->
    <rect x="310" y="40" width="100" height="48" rx="8" fill="#1E293B" stroke="#10B981" stroke-width="2"/>
    <text x="360" y="69" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">DATA STORE</text>
  </g>

  <!-- Laptop / Presentation Mockup Center -->
  <g transform="translate(140, 210)">
    <!-- Laptop screen -->
    <rect x="40" y="20" width="240" height="150" rx="10" fill="#0B1120" stroke="#334155" stroke-width="2"/>
    <rect x="52" y="32" width="216" height="126" rx="6" fill="#1E293B"/>
    
    <!-- Charts inside screen -->
    <rect x="65" y="45" width="80" height="10" rx="3" fill="#0CA9B7"/>
    <rect x="65" y="62" width="50" height="6" rx="2" fill="#475569"/>
    
    <!-- Mini bar chart -->
    <rect x="65" y="100" width="16" height="40" rx="3" fill="#0CA9B7"/>
    <rect x="90" y="85" width="16" height="55" rx="3" fill="#38BDF8"/>
    <rect x="115" y="70" width="16" height="70" rx="3" fill="#10B981"/>
    <rect x="140" y="90" width="16" height="50" rx="3" fill="#6366F1"/>

    <!-- Laptop base -->
    <path d="M10 170 L310 170 L290 185 L30 185 Z" fill="#334155"/>
  </g>

  <!-- Tag Pill -->
  <g transform="translate(180, 420)">
    <rect width="240" height="40" rx="20" fill="rgba(15, 23, 42, 0.9)" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="120" y="25" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="700" fill="#38BDF8" text-anchor="middle">BPMN & ARSITEKTUR SISTEM</text>
  </g>
</svg>
